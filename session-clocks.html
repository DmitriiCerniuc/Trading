<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session Clocks</title>
<style>
:root{
  --fg:#ededed;--dim:#9a9a9a;--faint:#6f6f6f;
  --panel:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);
  --chip:rgba(255,255,255,.06);--accent:#e0a458;--open:#4ade80;
}
@media (prefers-color-scheme:light){
  :root{--fg:#1f1f1f;--dim:#5a5a5a;--faint:#7d7d7d;
    --panel:rgba(0,0,0,.03);--line:rgba(0,0,0,.1);--chip:rgba(0,0,0,.05);
    --accent:#b8791f;--open:#1a8a45}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;height:100%;overflow:hidden}
#fit{transform-origin:top left;width:100%}
body{color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;padding:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative;overflow:hidden}
.card.open{border-color:rgba(74,222,128,.35)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px}
.name{font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:600}
.badge{font-size:8.5px;letter-spacing:.08em;padding:2px 6px;border-radius:20px;background:var(--chip);color:var(--faint);display:flex;align-items:center;gap:4px;white-space:nowrap}
.badge.open{background:rgba(74,222,128,.14);color:var(--open)}
.dot{width:4px;height:4px;border-radius:50%;background:currentColor}
.time{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.bot{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px;font-size:9.5px;color:var(--faint);gap:6px}
.eta{color:var(--accent);white-space:nowrap;font-weight:500}
.eta.weekend{color:var(--faint);font-weight:400}
.bar{position:absolute;left:0;bottom:0;height:2px;background:var(--open);width:0;transition:width 1s linear}
.note{margin-top:8px;font-size:9.5px;color:var(--faint);line-height:1.5}
@media (max-height:230px){.note{display:none}}
</style>
</head>
<body>
<div id="fit">
<div class="grid" id="grid"></div>
<div class="note">Local exchange time, daylight saving handled automatically. Market closed Friday 17:00 New York to Sunday 17:00 New York.</div>
<script>
var SESSIONS=[
 {name:"SYDNEY",tz:"Australia/Sydney",label:"Sydney",open:7,close:16},
 {name:"TOKYO",tz:"Asia/Tokyo",label:"Tokyo",open:9,close:18},
 {name:"LONDON",tz:"Europe/London",label:"London",open:8,close:16},
 {name:"NEW YORK",tz:"America/New_York",label:"New York",open:8,close:17}
];
var WD={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
function parts(d,tz){
  var p=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(d);
  function g(t){for(var i=0;i<p.length;i++){if(p[i].type===t)return p[i].value}return "0"}
  var h=parseInt(g("hour"),10); if(h===24)h=0;
  return {h:h,m:parseInt(g("minute"),10),s:parseInt(g("second"),10),wd:WD[g("weekday")]};
}
function pad(n){return String(n).length<2?"0"+n:String(n)}
function dur(sec){var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h>0?h+"h "+m+"m":m+"m"}
var html="";
for(var i=0;i<SESSIONS.length;i++){
  html+='<div class="card" id="c'+i+'">'
    +'<div class="top"><div class="name">'+SESSIONS[i].name+'</div>'
    +'<div class="badge" id="b'+i+'"><span class="dot"></span><span id="bt'+i+'">CLOSED</span></div></div>'
    +'<div class="time" id="t'+i+'">--:--:--</div>'
    +'<div class="bot"><span>'+SESSIONS[i].label+'</span><span class="eta" id="e'+i+'"></span></div>'
    +'<div class="bar" id="p'+i+'"></div></div>';
}
document.getElementById("grid").innerHTML=html;
function tick(){
  var now=new Date();
  var ny=parts(now,"America/New_York");
  var nySec=ny.h*3600+ny.m*60+ny.s;
  var weekend = ny.wd===6 || (ny.wd===0 && nySec<17*3600) || (ny.wd===5 && nySec>=17*3600);
  for(var i=0;i<SESSIONS.length;i++){
    var s=SESSIONS[i], p=parts(now,s.tz);
    var cur=p.h*3600+p.m*60+p.s, o=s.open*3600, c=s.close*3600;
    document.getElementById("t"+i).textContent=pad(p.h)+":"+pad(p.m)+":"+pad(p.s);
    var card=document.getElementById("c"+i),badge=document.getElementById("b"+i),
        bt=document.getElementById("bt"+i),eta=document.getElementById("e"+i),bar=document.getElementById("p"+i);
    var isOpen=!weekend && cur>=o && cur<c;
    if(isOpen){card.className="card open";badge.className="badge open";bt.textContent="OPEN"}
    else{card.className="card";badge.className="badge";bt.textContent="CLOSED"}
    if(weekend){eta.className="eta weekend";eta.textContent="Weekend";bar.style.width="0"}
    else if(isOpen){eta.className="eta";eta.textContent="Closes "+dur(c-cur);bar.style.width=((cur-o)/(c-o)*100).toFixed(2)+"%"}
    else{eta.className="eta";eta.textContent="Opens "+dur(((o-cur)+86400)%86400);bar.style.width="0"}
  }
}
tick();setInterval(tick,1000);
</script>
</div>
<script>
(function(){var f=document.getElementById("fit"),k=1;
function fit(){var W=document.documentElement.clientWidth,H=document.documentElement.clientHeight;
for(var i=0;i<5;i++){f.style.width=(W/k)+"px";f.style.transform="none";
var need=f.scrollHeight,nk=Math.max(.55,Math.min(1,H/need));
if(Math.abs(nk-k)<.005)break;k=nk}
f.style.width=(W/k)+"px";f.style.transform="scale("+k+")"}
window.addEventListener("resize",fit);
if(window.ResizeObserver){new ResizeObserver(fit).observe(f)}
fit();setTimeout(fit,80);setTimeout(fit,400)})();
</script>
</body>
</html>
